<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>Create Account – Samartha</title>

    <meta
      name="description"
      content="Buat akun Samartha dan mulai mengotomatisasi workflow bisnis Anda dengan AI."
    />

    <meta name="robots" content="noindex, nofollow" />

    <meta property="og:title" content="Register – Samartha" />
    <meta
      property="og:description"
      content="Mulai perjalanan automation bisnis Anda bersama Samartha."
    />

    <meta name="twitter:title" content="Register – Samartha" />
    <meta
      name="twitter:description"
      content="Buat akun Samartha dan mulai automation."
    />

    <link rel="icon" href="09_Bahan/assets/logo.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="09_Website/css/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="auth-section-simple">
      <div class="shape-deco shape-1">
        <div class="starburst spinner"></div>
      </div>
      <div class="shape-deco shape-2">
        <div class="flower spinner"></div>
      </div>

      <div class="hero-bg-shapes" aria-hidden="true">
        <div class="hero-shape shape-1"></div>
        <div class="hero-shape shape-2"></div>
        <div class="hero-shape shape-3"></div>
      </div>

      <div class="auth-container-simple">
        <div class="auth-logo">
          <a href="index.html">
            <img src="09_Bahan/assets/logo.webp" alt="Samartha" />
            <span>Samartha</span>
          </a>
        </div>

        <div class="auth-card">
          <div class="auth-card-header">
            <h1>Create your account</h1>
            <p>Start automating your business today</p>
          </div>

          <button class="social-btn-simple" id="googleRegister">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              />
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              />
              <path
                fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              />
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              />
            </svg>
            Continue with Google
          </button>

          <div class="divider-simple">
            <span>or</span>
          </div>

          <form class="auth-form-simple" id="registerForm" novalidate>
            <div class="form-group-simple">
              <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Full name"
                autocomplete="name"
                required
              />
            </div>

            <div class="form-group-simple">
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Work email"
                autocomplete="email"
                required
              />
            </div>

            <div class="form-group-simple">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Create password (min. 8 characters)"
                autocomplete="new-password"
                required
              />
            </div>

            <button type="submit" class="btn btn-primary btn-full">
              Create account
            </button>
          </form>

          <div class="auth-card-footer">
            <span>Already have an account?</span>
            <a href="login.html" class="text-link">Sign in</a>
          </div>
        </div>

        <p class="auth-footer-note">
          By continuing, you agree to our
          <a href="#">Terms of Service</a> and
          <a href="#">Privacy Policy</a>
        </p>
      </div>

      <div class="toast" id="toast">
        <span class="toast-icon">✓</span>
        <span class="toast-message"></span>
      </div>
    </section>

    <script src="09_Website/js/script.js"></script>
  </body>
</html>
